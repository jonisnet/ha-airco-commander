start_sleep_timer:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          domain: climate
    duration:
      required: true
      example: 90
      selector:
        number:
          min: 1
          max: 1440
          unit_of_measurement: min
          mode: box

cancel_sleep_timer:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          domain: climate

set_off_timer:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          domain: climate
    time:
      required: false
      example: "22:00"
      selector:
        time:
    enabled:
      required: false
      selector:
        boolean:
